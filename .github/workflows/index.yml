name: Validate posts and rebuild index
on:
  push:
    branches: [main]
    paths: ["posts/**", "scripts/build_index.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/build_index.py
      - name: Commit index.json if it changed
        run: |
          if ! git diff --quiet -- index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add index.json && git commit -m "Rebuild index.json" && git push
          fi
